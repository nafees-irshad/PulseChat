
name: Deploy Staging Backend to AWS

on:
  push:
    branches:
      - staging
    paths:
      - "server/**"
      - ".github/workflows/deploy-staging.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Deploy staging backend through SSM
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "i-07203ae8cbaa6a057" \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=[
              "sudo -u ubuntu bash -lc '\''set -e; cd /home/ubuntu/PulseChat-Staging; git pull --ff-only origin staging; cd server; npm ci; pm2 restart pulsechat-staging --update-env'\''"
            ]' \
            --query "Command.CommandId" \
            --output text)

          echo "Command ID: $COMMAND_ID"

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "i-07203ae8cbaa6a057"

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "i-07203ae8cbaa6a057"
